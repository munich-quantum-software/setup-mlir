name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  update_release_draft:
    name: Run
    permissions:
      contents: write
    runs-on: ubuntu-slim
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        id: release-drafter
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upload installation scripts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release-drafter.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" installation/setup-mlir.sh installation/setup-mlir.ps1 --clobber
